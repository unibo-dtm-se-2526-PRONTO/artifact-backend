# Weekly pull requests against develop. chore(deps) and ci(deps) make no
# release by themselves. Patch and minor updates are merged by
# dependabot-automerge.yml.
version: 2
updates:
  # Poetry: pyproject.toml and poetry.lock
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    assignees:
      - sara-ladisa
    commit-message:
      prefix: chore
      include: scope

  # semantic-release and its preset, in package.json
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    assignees:
      - sara-ladisa
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    assignees:
      - sara-ladisa
    commit-message:
      prefix: ci
      include: scope

  # Docker images: patches only; Python, Node and PostgreSQL majors by hand.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    assignees:
      - sara-ladisa
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    assignees:
      - sara-ladisa
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
