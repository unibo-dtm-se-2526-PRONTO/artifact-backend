name: deploy
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: Release
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history

      - name: Get All Tags
        run: git fetch --tags -f

      - name: Dry-run Release for Initial Commit
        id: skip_release
        run: |
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      # Poetry is only needed for `poetry version`, which semantic-release runs
      # to record the new version in pyproject.toml
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Get Node Version
        id: get-node-version
        run: echo version=$(jq -r .engines.node package.json) >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.get-node-version.outputs.version }}

      - name: Release
        shell: bash
        run: |
          npm install
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # The release commit is authored by the owner of RELEASE_TOKEN rather
          # than semantic-release-bot, so tag, commit and GitHub release all
          # come from the same account. The no-reply address keeps a real one
          # out of a public history while still linking the commit to the account.
          GIT_AUTHOR_NAME: Giulio Salotti
          GIT_AUTHOR_EMAIL: 93626674+giuliosalotti@users.noreply.github.com
          GIT_COMMITTER_NAME: Giulio Salotti
          GIT_COMMITTER_EMAIL: 93626674+giuliosalotti@users.noreply.github.com
          # dry run if not on main/master branch, or if initial commit
          RELEASE_DRY_RUN: ${{ steps.skip_release.outputs.skip == 'true' || (github.ref_name != 'master' && github.ref_name != 'main') }}
