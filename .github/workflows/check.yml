name: CI/CD
on:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'
    paths-ignore:
      - '.gitignore'
      - '.mergify.yml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    name: Preliminary Checks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history

      # the Python of the Dockerfile, which is what the backend runs on
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Restore Development Environment
        run: poetry install

      - name: Check code is syntactically correct
        shell: bash
        run: poetry run poe compile

      - name: Static Checks
        shell: bash
        run: poetry run poe static-checks

      - name: Format Check
        shell: bash
        run: poetry run poe format-check

      # on the default in-memory SQLite: the suite must keep passing with no
      # database server, as it does on a developer's machine
      - name: Test
        shell: bash
        run: poetry run poe test

  test:
    needs: check
    runs-on: ubuntu-latest
    name: Test on PostgreSQL
    timeout-minutes: 45
    services:
      # the same image as the db service of docker-compose.yml
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pronto
          POSTGRES_USER: pronto
          POSTGRES_PASSWORD: pronto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pronto -d pronto"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # read by pronto/settings.py: run the suite on the service above, so the
      # tests marked `postgres` run here instead of being skipped
      TEST_DATABASE_URL: postgres://pronto:pronto@localhost:5432/pronto?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Restore Development Environment
        run: poetry install

      # Coverage is measured here rather than on SQLite: only this run reaches
      # the FAQ matching, so only here does the report describe the whole code.
      - name: Test with Coverage
        shell: bash
        # -rs lists the skipped tests: none should be skipped here
        run: |
          poetry run poe coverage -rs
          poetry run poe coverage-report
          poetry run poe coverage-html

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: htmlcov
          if-no-files-found: ignore
          overwrite: true

  # Brings the shared Neon database to the schema of develop as soon as a change
  # lands there, so nobody has to remember to run `migrate` by hand. Only on a
  # push to develop — a merged pull request — and only once both test runs are
  # green: a branch or a red build never touches the database the team shares.
  migrate-neon:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Migrate the Neon database
    # The credentials live in this environment's secrets. Required reviewers can
    # be added to it in the repository settings, without touching this file.
    environment: neon
    # Two merges in a row migrate one after the other, never at the same time,
    # and a migration already running is never cancelled halfway.
    concurrency:
      group: neon-migrate
      cancel-in-progress: false
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_SSLMODE: require
      # Django refuses to start without one, but migrate signs nothing, so a
      # throwaway value does instead of yet another secret.
      SECRET_KEY: migrate-only-${{ github.run_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      # The runtime dependencies are all migrate needs.
      - name: Restore Runtime Environment
        run: poetry install --only main

      # Printed before anything changes, so the log says what was applied.
      - name: Show the migration plan
        run: poetry run python manage.py migrate --plan

      - name: Migrate
        run: poetry run python manage.py migrate --noinput

      - name: Check nothing is left unapplied
        run: poetry run python manage.py migrate --check

  deploy:
    name: Deploy
    permissions:
      contents: write
      packages: write
    needs:
      - test
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
