name: dependabot-automerge
# Turns on auto-merge for Dependabot's patch and minor updates: GitHub merges
# them into develop once the checks the branch protection of develop requires
# are green. Majors wait for a person. Without required checks GitHub would
# merge at once, untested, so they are a precondition of this workflow.
on:
  pull_request:
permissions:
  contents: read
jobs:
  automerge:
    name: Auto-merge Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the Update
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable Auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # a merge commit, like the other pull requests into develop
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
