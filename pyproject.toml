[tool.poetry]
name = "artifact-backend"
package-mode = false
version = "2.4.1"
description = "Backend of a web application that automates the phone helpdesk of the Campus of Cesena"
authors = ["Sara Ladisa <sara.ladisa@studio.unibo.it>", "Giulio Salotti <giulio.salotti@studio.unibo.it>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
# CI and the Dockerfile run on Python 3.12: update .github/workflows/check.yml
# and the Dockerfile together if that changes
python = ">= 3.10.0 < 4.0.0"
django = "^5.2"
python-dotenv = "^1.0.1"
djangorestframework = "^3.16.0"
django-cors-headers = "^4.4.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
pytest = "^8.3.5"
ruff = "^0.15.0"
pytest-django = "^4.2.0"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy pronto accounts booking faq tests"
compile = "python -m compileall pronto accounts booking faq tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pronto.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "postgres: needs PostgreSQL; skipped when the tests run on SQLite (see TEST_DATABASE_URL)",
]

[tool.mypy]
# Django does not ship type stubs (no py.typed marker)
ignore_missing_imports = true
