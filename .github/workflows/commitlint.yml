name: commitlint
# semantic-release computes the version from Conventional Commits.
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  commitlint:
    name: Conventional Commits
    # Not on the release pull request: its commits were checked on develop.
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits of the pull request

      - name: Lint Commit Messages
        uses: wagoid/commitlint-github-action@v6
