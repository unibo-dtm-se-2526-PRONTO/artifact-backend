services:
  # Local PostgreSQL, reachable from localhost only.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pronto
      POSTGRES_USER: pronto
      POSTGRES_PASSWORD: pronto
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pronto -d pronto"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Vector store for semantic FAQ matching; same version as chromadb in poetry.lock.
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chromadata:/data
    healthcheck:
      # No curl or wget in the image.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    # Override .env: always use the db container.
    environment:
      DB_NAME: pronto
      DB_USER: pronto
      DB_PASSWORD: pronto
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      # Keeps the downloaded embedding model.
      FASTEMBED_CACHE_PATH: /fastembed
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - .:/app
      - fastembed:/fastembed

  # The Vue frontend from ../artifact-frontend, on http://localhost:5173.
  frontend:
    build:
      context: ../artifact-frontend
      dockerfile: ../artifact-backend/frontend.Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    volumes:
      - ../artifact-frontend:/app
      # Keeps the image's node_modules.
      - /app/node_modules

volumes:
  pgdata:
  chromadata:
  fastembed:
