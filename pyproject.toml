[tool.poetry]
name = "artifact-backend"
packages = [
    { include = "artifact-backend" },
]
version = "2.4.1"
description = "Backend of a web application that automates the phone helpdesk of the Campus of Cesena"
authors = ["Sara Ladisa <sara.ladisa@studio.unibo.it>", "Giulio Salotti <giulio.salotti@studio.unibo.it>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">= 3.10.0 < 4.0.0"
django = "^5.2"
python-dotenv = "^1.0.1"
djangorestframework = "^3.16.0"
django-cors-headers = "^4.4.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"
pytest-django = "^4.2.0"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy artifact-backend tests"
compile = "python -m compileall artifact-backend tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
