name: deploy
on: #chi può lanciarlo
  workflow_call: #permette ad altri workflow di richiamarlo. in questo caso, deploy è nested in check
  workflow_dispatch: #permette di lanciarlo a mano dalla tab actions di gh
permissions:
  contents: write
  packages: write
  # semantic-release comments on the issues and pull requests a release ships
  issues: write
  pull-requests: write
jobs:
  release:
    name: Release
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history

      - name: Get All Tags
        run: git fetch --tags -f

      - name: Dry-run Release for Initial Commit
        id: skip_release
        run: |
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      # Poetry records the new version in pyproject.toml (`poetry version`),
      # then builds the package and uploads it (`poetry publish --build`)
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Get Node Version
        id: get-node-version
        run: echo version=$(jq -r .engines.node package.json) >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.get-node-version.outputs.version }}

      - name: Release
        shell: bash
        run: |
          npm install
          npx semantic-release
        env:
          # The token Actions generates for every run, so no personal token can
          # expire: tag and GitHub release come from github-actions[bot], the
          # release commit from semantic-release-bot. Its pushes start no
          # other workflow, which the release commit skips anyway ([skip ci]).
          GITHUB_TOKEN: ${{ github.token }}
          # One secret for both indexes: it holds a TestPyPI token while
          # releases go to TestPyPI, a PyPI token once they go to PyPI.
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
          POETRY_PYPI_TOKEN_TESTPYPI: ${{ secrets.PYPI_TOKEN }}
          # TestPyPI unless the repository variable PUBLISH_TO_PYPI is 'true'
          # (Settings → Secrets and variables → Actions → Variables), so a
          # missing variable can never publish to the real PyPI by mistake.
          RELEASE_TEST_PYPI: ${{ vars.PUBLISH_TO_PYPI != 'true' }}
          # dry run if not on main/master branch, or if initial commit
          RELEASE_DRY_RUN: ${{ steps.skip_release.outputs.skip == 'true' || (github.ref_name != 'master' && github.ref_name != 'main') }}
