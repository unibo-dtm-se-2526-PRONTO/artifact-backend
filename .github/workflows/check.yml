name: CI/CD
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.github/dependabot.yml'
      - '.gitignore'
      - '.mergify.yml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    name: Preliminary Checks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history

      # the Python of the Dockerfile
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Restore Development Environment
        run: poetry install

      - name: Check code is syntactically correct
        shell: bash
        run: poetry run poe compile

      - name: Static Checks
        shell: bash
        run: poetry run poe static-checks

      - name: Format Check
        shell: bash
        run: poetry run poe format-check

      # on in-memory SQLite, as on a developer's machine
      - name: Test
        shell: bash
        run: poetry run poe test

  test:
    needs: check
    runs-on: ubuntu-latest
    name: Test on PostgreSQL
    timeout-minutes: 45
    services:
      # the same image as the db service of docker-compose.yml
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pronto
          POSTGRES_USER: pronto
          POSTGRES_PASSWORD: pronto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pronto -d pronto"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # runs the suite on the service above, `postgres` tests included
      TEST_DATABASE_URL: postgres://pronto:pronto@localhost:5432/pronto?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Restore Development Environment
        run: poetry install

      # Coverage here, the only run that reaches every test.
      - name: Test with Coverage
        shell: bash
        # -rs lists the skipped tests: none should be skipped here
        run: |
          poetry run poe coverage -rs
          poetry run poe coverage-report
          poetry run poe coverage-html

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: htmlcov
          if-no-files-found: ignore
          overwrite: true

  # Migrates the shared Neon database to develop's schema after green tests,
  # on a push to develop or a manual run there (also from dependabot-automerge).
  migrate-neon:
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Migrate the Neon database
    # The credentials are this environment's secrets.
    environment: neon
    # One migration at a time, never cancelled halfway.
    concurrency:
      group: neon-migrate
      cancel-in-progress: false
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_SSLMODE: require
      # Required by Django, unused by migrate.
      SECRET_KEY: migrate-only-${{ github.run_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        # the version pinned in the Dockerfile, the only place it is written
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$(sed -n 's/^ARG POETRY_VERSION=//p' Dockerfile)"

      - name: Restore Runtime Environment
        run: poetry install --only main

      - name: Show the migration plan
        run: poetry run python manage.py migrate --plan

      - name: Migrate
        run: poetry run python manage.py migrate --noinput

      - name: Check nothing is left unapplied
        run: poetry run python manage.py migrate --check

  deploy:
    name: Deploy
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    needs:
      - test
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
